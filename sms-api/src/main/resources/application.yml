# 項目相關配置
sms:
  # 名稱
  name: sms
  # 版本
  version: 0.0.0
  # 版權年份
  copyrightYear: 2025
  # 實例演示開關
  demoEnabled: true
  # 文件路徑 （默認）
  profile: /usr/local/upload
  # 學生相冊存放路徑
  photoPath: /usr/local/upload/student_photos
  # 獲取 ip地址開關
  addressEnabled: false
  # app交互祕鑰
  appSecret: kKhPdvEBDjck1RK7
  # app交互時間誤差範圍(毫秒)
  apiTimeRange: 300000
  # 加密鹽值，用於敏感ID加密
  encryption:
    salt: 5nQtaatpcOs9iKsM

# 學籍系統學生照片（由後端代理，前端不直接訪問；改地址只需改配置並重啟服務，無需改代碼）
# 可用環境變量覆蓋：STUDENT_INFO_PHOTO_URL_TEMPLATE
student-info:
  photo:
    url-template: http://tals-stuinfo.esp.edu.mo:5222/api/v1/resources/students/{studentProfileNumber}/photo
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

# 開發環境配置
server:
  # 服務器的 HTTP 端口，默認為 80
  port: 8006
  servlet:
    # 應用的訪問路徑
    context-path: /sms-api
  tomcat:
    # tomcat 的 URI 編碼
    uri-encoding: UTF-8
    # 連接數滿後的排隊數，默認為 100
    accept-count: 1000
    threads:
      # tomcat 最大線程數，默認為 200
      max: 800
      # Tomcat 啟動初始化的線程數，默認值 10
      min-spare: 100
 
# 用戶配置
user:
  password:
    # 密碼錯誤{maxRetryCount}次鎖定 10 分鐘
    maxRetryCount: 5
  # 首頁地址
  indexUrl: /index

# Spring 配置
spring:
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 禁用緩存
    cache: false
  # 資源資訊
  messages:
    # 國際化資源文件路徑
    basename: static/i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    # 默認使用開發環境配置（不啟用 logback）
    active: dev
  # 文件上傳
  servlet:
    multipart:
      # 單個文件大小
      max-file-size: 10MB
      # 設置總上傳的文件大小
      max-request-size: 20MB
  # 服務模塊
  devtools:
    restart:
      # 熱部署開關
      enabled: true

# MyBatis
mybatis:
  # 搜尋指定包別名
  typeAliasesPackage: com.sms.**.entity,com.sms.**.domain
  # 配置 mapper 的掃描，找到所有的 mapper.xml 映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加載全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper 分頁插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 防止 XSS 攻擊
xss:
  # 過濾開關
  enabled: true
  # 排除連結（多個用逗號分隔）
  excludes: /system/notice/*
  # 匹配連結
  urlPatterns: /system/*,/monitor/*,/tool/*

# 防止 csrf 攻擊
csrf:
  # 過濾開關
  enabled: false
  # 白名單（多個用逗號分隔）
  whites: /druid

# Swagger 配置
swagger:
  # 是否開啟 swagger
  enabled: true
